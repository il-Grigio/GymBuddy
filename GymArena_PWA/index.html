<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymArena</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0A0A0F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GymArena"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0F;--card:#15151e;--line:#262633;--tx:#f2f2f7;--mu:#8b8b9e;--red:#FF3C3C;--or:#FF8C00;--cy:#00E5FF;--gold:#FFD700;--gr:#00E676;--vi:#7C3AED;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 'DM Sans',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1,h2,.big{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em;margin:0}
h2{font-size:26px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--or));border-radius:8px}
.lv{font-size:56px;line-height:1;color:var(--or)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats b{display:block;font:28px 'Bebas Neue';color:var(--cy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.g .big{font-size:26px;display:block}.g .bar{margin-top:8px;height:5px}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:16px;font:700 16px 'DM Sans';width:100%;cursor:pointer}
.btn.sm{width:auto;padding:10px 16px;font-size:14px}.btn.gh{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:8px 12px;font:600 13px 'DM Sans';cursor:pointer}
.chip.on{border-color:var(--cy);color:var(--cy);background:#00e5ff14}.chip.off{opacity:.35}
.week{display:flex;gap:8px;align-items:flex-end;height:90px}.week div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.week i{display:block;background:var(--cy);border-radius:6px;margin-bottom:4px;min-height:4px}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;font-size:12px;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.bd div b{display:block;font-size:26px}.bd .lock{opacity:.3;filter:grayscale(1)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0d14ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);padding:10px 0 12px;font:600 12px 'DM Sans';cursor:pointer}nav button b{display:block;font-size:20px}nav .on{color:var(--or)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}.tp{background:#00e67622;color:var(--gr)}.tn{background:#ff3c3c22;color:var(--red)}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.d{background:var(--gr)}
.kg{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0}.kg button{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:24px}
.kg input{width:120px;text-align:center;font:56px 'Bebas Neue';background:none;border:0;color:var(--tx)}
.rate{display:grid;gap:10px}.rate button{font:700 20px 'DM Sans';padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.ov{position:fixed;inset:0;background:#0A0A0Ff2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20}.ov.on{display:flex}
.ring{position:relative;width:220px;height:220px}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--cy);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:80px 'Bebas Neue'}
.pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font:64px 'Bebas Neue';color:var(--gold);z-index:30;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-90px);opacity:0}}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:var(--vi);padding:12px 16px;border-radius:14px;font-weight:700;display:none;z-index:25;text-align:center}
.demo{margin:10px 0}.demo img{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#fff}.demo details{margin:6px 0}
.in{width:100%;padding:12px;margin:4px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit}textarea.in{height:90px}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
html.lt{--bg:#f4f4f8;--card:#fff;--line:#dcdce6;--tx:#15151e;--mu:#6a6a7c;color-scheme:light}html.lt nav{background:#fffffff2}html.lt .ov{background:#f4f4f8f2}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="rest" class="ov"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const K='gymarena_v1';
const def={xp:0,ses:0,streak:0,last:'',rest:[],badges:[],taste:{},w:{},wg:{},plan:null,pf:{av:'💪'},full:{},sport:{d:'',ids:[],paid:[]},rated:0,rs:60,zw:0,eqU:[],sd:0,rb:[],rbl:'',sx:[],tm:'',mp:null,ck:{},ns:0,nl:'',pd:0,lite:0,hist:[],pan:[],ft:{},cn:0,cu:[],nu:{goal:'mantenere',diet:'onnivora',al:[],ex:'',tmax:45,eq:['fornelli','forno','microonde']}};
function load(){try{return Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return Object.assign({},def)}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load(),V='home',VG=null,W=null,RT,WT;
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return fd(d)};
const GR={petto:['Petto','💪'],schiena:['Schiena','🦍'],gambe:['Gambe','🦵'],spalle:['Spalle','🏋️'],braccia:['Braccia','💥'],core:['Core','🎯'],full:['Full Body','🔥']};
const EX=`panca|Panca piana|petto|4|8|60|Scapole addotte, piedi saldi a terra
incl|Panca inclinata manubri|petto|3|10|50|Gomiti a 45° dal busto
croci|Croci ai cavi|petto|3|12|40|Braccia leggermente flesse, senti lo stiramento
push|Push-up|petto|3|15|30|Corpo in linea, petto a un pugno da terra
cpress|Chest press|petto|3|10|40|Spingi senza bloccare i gomiti
lat|Lat machine|schiena|4|10|50|Porta la barra al petto, scapole in basso
rem|Rematore bilanciere|schiena|4|8|60|Schiena neutra, tira verso l’ombelico
pulley|Pulley basso|schiena|3|12|40|Non dondolare col busto
traz|Trazioni|schiena|3|6|70|Parti da braccia tese, mento sopra la sbarra
remm|Rematore manubrio|schiena|3|10|50|Gomito vicino al fianco
squat|Squat|gambe|4|8|80|Ginocchia in linea con le punte, schiena dritta
lpress|Leg press|gambe|4|10|60|Non staccare i lombi dallo schienale
aff|Affondi|gambe|3|10|50|Busto eretto, ginocchio non oltre la punta
rom|Stacchi rumeni|gambe|3|10|60|Anche indietro, bilanciere vicino alle gambe
lcurl|Leg curl|gambe|3|12|40|Movimento controllato in discesa
mil|Military press|spalle|4|8|60|Addome contratto, non inarcare la schiena
lat2|Alzate laterali|spalle|3|15|40|Gomiti leggermente flessi, sali fino alle spalle
post|Alzate posteriori|spalle|3|15|40|Busto inclinato, apri le braccia
arn|Arnold press|spalle|3|10|50|Ruota i polsi durante la spinta
face|Face pull|spalle|3|15|40|Tira verso il viso, gomiti alti
curl|Curl bilanciere|braccia|3|10|40|Gomiti fermi lungo i fianchi
mart|Curl a martello|braccia|3|12|40|Polsi neutri, niente slancio
fren|French press|braccia|3|10|40|Gomiti stretti e puntati in alto
push2|Pushdown ai cavi|braccia|3|12|40|Gomiti fissi, estendi completamente
dip|Dip alle parallele|braccia|3|8|50|Scendi controllato, spalle lontane dalle orecchie
plank|Plank (45 s)|core|3|1|30|Bacino neutro, glutei contratti
crunch|Crunch|core|3|20|30|Solleva solo le scapole, collo rilassato
legr|Leg raise|core|3|12|40|Lombi a contatto con il pavimento
rus|Russian twist|core|3|20|30|Ruota dal busto, non dalle braccia
wheel|Ab wheel|core|3|10|50|Addome in tensione, non cedere con la schiena`.split('\n').map(l=>{const a=l.split('|');return{id:a[0],n:a[1],g:a[2],s:+a[3],r:a[4],xp:+a[5],t:a[6]}});
const SP=[['riposo','😴','Riposo',0,'Recupero attivo'],['camminata','🚶','Camminata',30,'Nessuna restrizione'],['yoga','🧘','Yoga',40,'Allenamento completo consigliato'],['tennis','🎾','Tennis',55,'Spalle e braccia già attive'],['corsa','🏃','Corsa',60,'Gambe ridotte'],['trekking','🥾','Trekking',65,'Gambe moderate'],['ciclismo','🚴','Ciclismo',70,'Gambe affaticate, punta sull’upper body'],['calcio','⚽','Calcio',75,'Gambe molto stanche'],['nuoto','🏊','Nuoto',80,'Spalle moderatamente sotto sforzo'],['boxe','🥊','Boxe',85,'Braccia affaticate'],['arrampicata','🧗','Arrampicata',90,'Braccia e schiena molto attive']];
const FT={tennis:['spalle',1],corsa:['gambe',1],trekking:['gambe',1],ciclismo:['gambe',1],calcio:['gambe',2],nuoto:['spalle',1],boxe:['braccia',1],arrampicata:['schiena',1]};
const BD=[['s7','🔥','Streak 7',()=>curStreak()>=7],['n10','💎','10 sessioni',()=>S.ses>=10],['n50','🦾','50 sessioni',()=>S.ses>=50],['n100','🥇','100 sessioni',()=>S.ses>=100],['ai','⚡','AI Master',()=>S.rated>=10],['ms','🏃','Multi-Sport',()=>sp().ids.filter(x=>x!=='riposo').length>=3],['pp','👨‍🍳','Primo piatto',()=>S.cn>=1],['cm','🌍','Chef del mondo',()=>S.cu.length>=5],['wk','🗓️','Settimana perfetta',()=>S.pd>=7],['zs','🧊','Zero sprechi',()=>S.zw>=10],['ph','🔧','Padrone di casa',()=>{const u=N().eq.filter(e=>EU.includes(e));return u.length>0&&u.every(e=>S.eqU.includes(e))}]];
const lvl=()=>Math.floor(S.xp/500)+1;
function sp(){if(S.sport.d!==day())S.sport={d:day(),ids:[],paid:[]};return S.sport}
function cont(last){const d=new Date(last+'T00:00:00'),t=new Date(day()+'T00:00:00');d.setDate(d.getDate()+1);while(d<t){if(!S.rest.includes(fd(d)))return false;d.setDate(d.getDate()+1)}return true}
const curStreak=()=>S.last&&cont(S.last)?S.streak:0;
function addXp(n){if(!n)return;S.xp+=n;const p=document.createElement('div');p.className='pop';p.textContent='+'+n+' XP';document.body.appendChild(p);setTimeout(()=>p.remove(),1100)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function checkB(){BD.forEach(b=>{if(!S.badges.includes(b[0])&&b[3]()){S.badges.push(b[0]);toast('Nuovo badge: '+b[1]+' '+b[2])}})}
const score=id=>S.taste[id]?S.taste[id].s:0;
const order=g=>EX.filter(e=>e.g===g).sort((a,b)=>score(b.id)-score(a.id));
const fat=g=>sp().ids.reduce((a,id)=>a+(FT[id]&&FT[id][0]===g?FT[id][1]:0),0);
const nSets=e=>Math.max(2,e.s-fat(e.g));
function aff(g){const v=EX.filter(e=>e.g===g&&S.taste[e.id]).map(e=>S.taste[e.id].s);return v.length?Math.round((v.reduce((a,b)=>a+b)/v.length+80)/180*100):50}
const sess=id=>{const m={};(S.w[id]||[]).forEach(x=>{m[x.sid]=Math.max(m[x.sid]||0,x.kg)});return Object.values(m)};
const lastKg=id=>{const a=S.w[id]||[];return a.length?a[a.length-1].kg:0};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function spark(v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;return`<svg width="100" height="30" viewBox="0 0 100 30"><polyline fill="none" stroke="#00E5FF" stroke-width="2" points="${v.map((y,i)=>(i/(v.length-1)*100).toFixed(1)+','+(28-(y-mn)/r*26).toFixed(1)).join(' ')}"/></svg>`}
const WQ={panca:'bench press',incl:'incline dumbbell press',croci:'cable fly',push:'push up',cpress:'chest press',lat:'lat pulldown',rem:'barbell row',pulley:'seated cable row',traz:'pull up',remm:'dumbbell row',squat:'squat',lpress:'leg press',aff:'lunges',rom:'romanian deadlift',lcurl:'leg curl',mil:'overhead press',lat2:'lateral raises',post:'rear delt fly',arn:'arnold press',face:'face pull',curl:'barbell curl',mart:'hammer curl',fren:'french press',push2:'triceps pushdown',dip:'dips',plank:'plank',crunch:'crunches',legr:'leg raise',rus:'russian twist',wheel:'ab wheel'};
const WB='https://wger.de',WF=new Set();
async function wfetch(id){
 if((S.wg[id]&&S.wg[id].ok)||WF.has(id)||!WQ[id])return;WF.add(id);
 try{
  const r=await(await fetch(WB+'/api/v2/exercise/search/?language=en&term='+encodeURIComponent(WQ[id]))).json();
  const sl=r.suggestions||[];if(!sl.length)throw 0;const s=sl[((S.wi||{})[id]||0)%sl.length];
  const x=await(await fetch(WB+'/api/v2/exerciseinfo/'+s.data.base_id+'/')).json();
  const tr=x.translations||[],t=tr.find(a=>a.language===13)||tr.find(a=>a.language===2)||tr[0]||{};
  const u=p=>p.indexOf('http')===0?p:WB+p;
  S.wg[id]={ok:1,v:String(s.value||'').slice(0,60),
   i:(x.images||[]).sort((a,b)=>(b.is_main?1:0)-(a.is_main?1:0)).slice(0,2).map(a=>u(a.image)),
   m:(x.muscles||[]).map(a=>a.name_en||a.name).filter(Boolean),
   d:(t.description||'').replace(/<[^>]*>/g,' ').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,400)};
  save();
  const el=$('#demo'),e=EX.find(a=>a.id===id);if(el&&e&&el.dataset.id===id)el.outerHTML=demo(e);
 }catch(err){WF.add(id)}
}
function demo(e){const c=S.wg[e.id];if(!c||!c.ok)return`<div id="demo" data-id="${e.id}"></div>`;
 return`<div id="demo" class="demo" data-id="${e.id}">${c.i.length?`<img id="dimg" data-id="${e.id}" data-k="0" src="${c.i[0]}" alt="${e.n}" onerror="this.style.display='none'">`:''}${c.m.length?`<p class="mu">Muscoli: ${c.m.join(', ')}</p>`:''}${c.d?`<details><summary class="mu">Come si fa</summary><p class="mu">${c.d}</p></details>`:''}<p class="mu" style="font-size:11px">Fonte: wger.de (CC-BY-SA) · ${esc(c.v||'')} <button class="chip" onclick="wnext('${e.id}')">↻ Altro</button></p></div>`}
setInterval(()=>{const im=$('#dimg');if(!im)return;const c=S.wg[im.dataset.id];if(!c||c.i.length<2)return;im.dataset.k=(+im.dataset.k+1)%c.i.length;im.src=c.i[im.dataset.k]},1200);
const GOALS=['forza','ipertrofia','resistenza','dimagrimento','full body'];
const GREP={forza:'5',ipertrofia:'10',resistenza:'18',dimagrimento:'14','full body':'10'};
const SPL={2:[['petto','spalle','braccia','core'],['gambe','schiena','core']],3:[['petto','spalle','braccia'],['schiena','core'],['gambe','core']],4:[['petto','braccia'],['gambe','core'],['schiena','spalle'],['gambe','core']],5:[['petto'],['schiena'],['gambe'],['spalle','core'],['braccia','gambe']]};
let PF={d:3,m:45,g:'ipertrofia'};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exMin=s=>s*(40+S.rs)/60+1;
const dayMin=(p,ids)=>Math.round(5+ids.length*exMin(p.sets));
function setPF(k,v){PF[k]=isNaN(v)?v:+v;render()}
function genPlan(){const {d,m,g}=PF,sets=m<=30?2:m<=45?3:4,n=Math.min(8,Math.max(3,Math.floor((m-5)/exMin(sets)))),used=new Set(),all=['petto','schiena','gambe','spalle','braccia','core'],list=[];
 for(let i=0;i<d;i++){const gs=g==='full body'?all:SPL[d][i],ids=[],pool=gs.map(k=>order(k).filter(e=>score(e.id)>=-20));
  for(let r=0;ids.length<n&&r<6;r++)for(let j=0;j<gs.length&&ids.length<n;j++){const c=pool[j].find(e=>!ids.includes(e.id)&&!used.has(e.id))||pool[j].find(e=>!ids.includes(e.id));if(c)ids.push(c.id)}
  ids.forEach(x=>used.add(x));list.push({gs,ex:ids})}
 S.plan={d,m,g,sets,reps:GREP[g],list};save();render()}
function askPlan(){if(!S.plan||confirm('Sostituire la scheda salvata?'))genPlan()}
function startDay(i){const p=S.plan;startW('plan',p.list[i].ex.map(id=>Object.assign({},EX.find(e=>e.id===id),{s:p.sets,r:p.reps})))}
function swapEx(i,k){const x=S.plan.list[i],e=EX.find(a=>a.id===x.ex[k]),c=order(e.g).filter(a=>a.id===e.id||(score(a.id)>=-20&&!x.ex.includes(a.id)));x.ex[k]=c[(c.findIndex(a=>a.id===e.id)+1)%c.length].id;save();render()}
function plan(){const p=S.plan,ch=(k,vs,u)=>`<div class="chips" style="margin:6px 0 14px">${vs.map(v=>`<button class="chip ${PF[k]===v?'on':''}" onclick="setPF('${k}','${v}')">${v}${u||''}</button>`).join('')}</div>`;
 return`<button class="chip" onclick="go('train')">← Allena</button><h1 style="font-size:40px;margin-top:10px">La mia scheda</h1>
 ${p?`<p class="mu">${p.d} giorni · ${p.m} min · ${p.g} · ${p.sets}×${p.reps}</p>${p.list.map((x,i)=>`<div class="card"><b>Giorno ${i+1}</b><div class="mu">${x.gs.map(k=>GR[k][0]).join(', ')} · circa ${dayMin(p,x.ex)} min · ${x.ex.length} esercizi</div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="startDay(${i})">Avvia</button><button class="btn sm gh" onclick="go('pday','${i}')">Modifica</button></div></div>`).join('')}`:'<div class="card mu">Nessuna scheda salvata. Creane una qui sotto.</div>'}
 <h2>Nuova scheda</h2><div class="mu">Giorni a settimana</div>${ch('d',[2,3,4,5])}<div class="mu">Durata media</div>${ch('m',[30,45,60,90],' min')}<div class="mu">Obiettivo</div>${ch('g',GOALS)}
 <button class="btn" onclick="askPlan()">Genera scheda</button><p class="mu">Il Full Body generico è sempre disponibile in Allena.</p>`}
function pday(){const p=S.plan,i=+VG,x=p.list[i];
 return`<button class="chip" onclick="go('plan')">← Scheda</button><h1 style="font-size:40px;margin-top:10px">Giorno ${i+1}</h1><p class="mu">${x.gs.map(k=>GR[k][0]).join(', ')} · circa ${dayMin(p,x.ex)} min</p>
 ${x.ex.map((id,k)=>{const e=EX.find(a=>a.id===id);return`<div class="card ex"><div><b>${e.n}</b><div class="mu">${GR[e.g][0]} · ${p.sets} × ${p.reps}</div></div><button class="chip" onclick="swapEx(${i},${k})">↻ Cambia</button></div>`}).join('')}
 <button class="btn" onclick="startDay(${i})">Avvia giornata</button>`}

function togSport(id){const s=sp(),i=s.ids.indexOf(id),t=day();
 if(i>=0){s.ids.splice(i,1);refund(id);if(id==='riposo')S.rest=S.rest.filter(x=>x!==t)}
 else{if(id==='riposo'){s.ids.slice().forEach(refund);s.ids=['riposo'];if(!S.rest.includes(t))S.rest.push(t)}else{if(s.ids.includes('riposo')){S.rest=S.rest.filter(x=>x!==t)}s.ids=s.ids.filter(x=>x!=='riposo').concat(id)}

function startW(g,pl){const l=pl?pl:g==='full'?Object.keys(GR).filter(k=>k!=='full').map(k=>order(k)[0]):order(g).filter(e=>score(e.id)>=-20).slice(0,4);
 W={g,ex:l,i:0,s:0,t0:Date.now(),sid:Date.now(),xp:0,sets:0,kg:0};initEx();clearInterval(WT);WT=setInterval(()=>{const t=$('#tt');if(t)t.textContent=mmss(Math.floor((Date.now()-W.t0)/1000))},1000);go('work')}
function initEx(){const e=W.ex[W.i];W.s=0;W.n=nSets(e);W.kg=lastKg(e.id);wfetch(e.id);if(W.ex[W.i+1])wfetch(W.ex[W.i+1].id)}
function adj(d){W.kg=Math.max(0,tk(cv(W.kg)+d));$('#kg').value=cv(W.kg)}
function work(){const e=W.ex[W.i];
 if(W.s>=W.n)return`<h1 style="font-size:36px">${e.n}</h1><p class="mu">Fatto! Ti è piaciuto questo esercizio?</p><div class="rate"><button onclick="rate(100)">❤️ Adoro</button><button onclick="rate(0)">😐 Meh</button><button onclick="rate(-80)">💀 Odio</button></div>`;
 return`<div class="row sp mu"><span>Esercizio ${W.i+1}/${W.ex.length}</span><span>⏱ <b id="tt">${mmss(Math.floor((Date.now()-W.t0)/1000))}</b></span><button class="chip" onclick="cycleRest()">Riposo ${S.rs}s</button></div>
 <h1 style="font-size:44px;margin-top:14px">${e.n}</h1><p class="mu">${e.t}</p>${demo(e)}<p>${W.n} serie × ${e.r}</p>
 ${(S.full[e.id]||0)>=3?'<div class="card" style="border-color:var(--gr)">💪 Completi tutto con facilità: prova +'+cv(2.5)+' '+ul()+'.</div>':''}
 <div class="dots">${Array.from({length:W.n},(_,k)=>`<i class="${k<W.s?'d':''}"></i>`).join('')}</div>
 <div class="kg"><button onclick="adj(-2.5)">−</button><input id="kg" type="number" inputmode="decimal" step="0.5" value="${cv(W.kg)}" onchange="W.kg=tk(parseFloat(this.value)||0)"><button onclick="adj(2.5)">+</button></div><p class="mu" style="text-align:center;margin-top:-6px">${ul()}</p>
 <button class="btn" onclick="doSet()">Serie ${W.s+1}/${W.n} completata</button>
 <p style="text-align:center"><button class="chip" onclick="nextEx()">Salta esercizio</button> <button class="chip" onclick="if(confirm('Terminare l’allenamento?'))finish()">Termina</button></p>`}
function cycleRest(){const o=[30,60,90,120];S.rs=o[(o.indexOf(S.rs)+1)%4];save();render()}
function doSet(){const e=W.ex[W.i],kg=tk(parseFloat($('#kg').value)||0);W.kg=kg;(S.w[e.id]=S.w[e.id]||[]).push({d:day(),kg,sid:W.sid});
 const x=Math.round(e.xp/W.n);W.xp+=x;W.sets++;addXp(x);W.s++;save();render();if(W.s<W.n)startRest()}
function rate(v){const e=W.ex[W.i],t=S.taste[e.id];S.taste[e.id]=t?{s:t.s*.4+v*.6,n:t.n+1}:{s:v,n:1};S.rated++;
 const ss=(S.w[e.id]||[]).reduce((m,x)=>{(m[x.sid]=m[x.sid]||[]).push(x.kg);return m},{}),cur=Math.max(...(ss[W.sid]||[0])),prev=Math.max(0,...Object.keys(ss).filter(k=>k!=W.sid).map(k=>Math.max(...ss[k])));
 S.full[e.id]=cur>prev&&prev>0?0:(S.full[e.id]||0)+1;checkB();save();nextEx()}

function newCh(){const f=$('#cf').value,m=$('#cm').value,n=+$('#cd').value,fr=(S.fr||[]).find(x=>x.u===f);if(!fr||!MT[m])return toast('Scegli un amico');
 S.ch=S.ch||[];S.ch.push({id:Date.now(),f:fr.u,m,s:day(),e:day(n),mb:MT[m][2](),fb:fr[MT[m][1]]});save();render()}
function settle(){(S.ch||[]).forEach(c=>{if(day()>c.e&&!c.p){c.p=1;addXp(60);toast('Sfida conclusa! +60 XP')}});save()}
function soc(){settle();const F=S.fr||[],CH=S.ch||[],me={u:uid(),n:(S.pf.name||'Tu')+' (tu)',a:S.pf.av||'💪',l:lvl(),x:S.xp,s:curStreak()},all=[me].concat(F).sort((a,b)=>b.x-a.x);
 return`<h1 style="font-size:40px">Amici</h1><p class="mu">Niente account né server: ci si scambia un codice con sole statistiche aggregate (livello, XP, streak, badge). Peso e dati di salute restano sul tuo telefono.</p>
 <div class="card"><b>Il tuo codice amico</b><textarea id="mc" class="in" readonly onclick="this.select()">${myCode()}</textarea><button class="btn sm" onclick="shareC($('#mc').value)">Condividi</button><p class="mu" style="margin-bottom:0">Rimandalo ai tuoi amici quando vuoi aggiornare i tuoi punti.</p></div>
 <div class="card"><b>Importa un codice</b><textarea id="ic" class="in" placeholder="Incolla qui un codice amico, piano o ricetta"></textarea><button class="btn" onclick="importC()">Importa</button></div>
 <h2>Classifica</h2>${all.map((x,i)=>`<div class="card ex"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x.a)} <b>${esc(x.n)}</b><div class="mu">Liv. ${x.l} · 🔥 ${x.s}${x.t?' · aggiornato '+x.t:''}</div></span><span class="row"><b>${x.x} XP</b>${x.u!==me.u?`<button class="chip" onclick="delF('${x.u}')">✕</button>`:''}</span></div>`).join('')}
 <h2>Sfide a tempo</h2>${F.length?`<div class="card"><select id="cf" class="in">${F.map(f=>`<option value="${f.u}">${esc(f.n)}</option>`).join('')}</select><select id="cm" class="in">${Object.entries(MT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select id="cd" class="in">${[3,7,14].map(n=>`<option value="${n}">${n} giorni</option>`).join('')}</select><button class="btn" onclick="newCh()">Lancia la sfida</button></div>`:'<div class="card mu">Importa il codice di un amico per lanciare una sfida.</div>'}
 ${CH.map(c=>{const f=F.find(x=>x.u===c.f),m=MT[c.m],a=Math.max(0,m[2]()-c.mb),b=f?Math.max(0,f[m[1]]-c.fb):0,done=day()>c.e,nm2=f?esc(f.n):'amico rimosso';
 return`<div class="card"><div class="row sp"><b>${m[0]} vs ${nm2}</b><button class="chip" onclick="delCh(${c.id})">✕</button></div><div class="mu">${done?'Conclusa':'Fino al '+c.e}</div><div class="row sp" style="margin:8px 0 6px"><span>Tu <b>${a}</b></span><span>${nm2} <b>${b}</b></span></div><div class="bar"><i style="width:${a+b>0?a/(a+b)*100:50}%"></i></div><div class="mu" style="margin-top:6px">${done?(a>b?'Hai vinto! 🎉':a<b?'Stavolta no, ma hai partecipato':'Pareggio')+' · +60 XP':'Importa il suo codice aggiornato per vedere i suoi punti.'}</div></div>`}).join('')}`}
function remL(){const L=[],e=S.pan.filter(x=>dl(x)<=3);if(e.length)L.push('⏳ In scadenza: '+e.map(x=>x.n).join(', '));if(curStreak()>0&&S.last!==day()&&!sp().ids.includes('riposo'))L.push('🔥 Allenati oggi per mantenere la streak di '+curStreak()+' giorni, oppure segna Riposo');return L}
function remC(){const L=remL();return L.length?`<div class="card" style="border-color:var(--or)">${L.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}
function ntfUI(){return`<h2>Promemoria</h2><div class="chips"><button class="chip ${S.ntf?'on':''}" onclick="togNtf()">🔔 Notifiche sul dispositivo</button></div><p class="mu">Ti avvisano di scadenze e streak quando apri l’app. Quelle programmate ad app chiusa arrivano con Capacitor.</p>`}
function togNtf(){if(S.ntf){S.ntf=0;save();return render()}if(!('Notification' in window))return toast('Notifiche non supportate qui');Notification.requestPermission().then(p=>{S.ntf=p==='granted'?1:0;save();render();if(p!=='granted')toast('Permesso negato')})}
function ntfNow(){try{const L=remL();if(S.ntf&&L.length&&S.nd!==day()&&Notification.permission==='granted'){S.nd=day();save();new Notification('GymArena',{body:L.join('\n')})}}catch(e){}}

/* ===== SCANNER CODICE A BARRE (Open Food Facts) ===== */
let SC=null,SCB=null;
async function scanStart(cb){SCB=cb||null;
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('Scanner non supportato da questo browser: scrivi il codice a mano');
 const o=$('#rest');o.classList.add('on');o.innerHTML='<video id="sv" playsinline muted style="width:100%;max-width:520px;max-height:60vh;border-radius:16px;background:#000"></video><div class="mu">Inquadra il codice a barre</div><button class="btn sm gh" onclick="scanStop()">Annulla</button>';
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});SC={st,t:0};
  const v=$('#sv'),det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});v.srcObject=st;await v.play();
  SC.t=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;scanStop();try{navigator.vibrate&&navigator.vibrate(100)}catch(e){}(SCB||bcLook)(c)}}catch(e){}},300)
 }catch(e){scanStop();toast('Fotocamera non disponibile: scrivi il codice a mano')}}
function scanStop(){if(SC){clearInterval(SC.t);SC.st.getTracks().forEach(t=>t.stop());SC=null}$('#rest').classList.remove('on')}
async function bcLook(c){c=String(c||'').replace(/\D/g,'');const m=$('#bm'),say=t=>{if(m)m.textContent=t};
 if(c.length<8||c.length>14)return say('Codice non valido');
 S.bc=S.bc||{};let x=S.bc[c];
 if(!x){say('Cerco '+c+'…');
  try{const r=await(await fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=product_name,product_name_it,generic_name_it,generic_name')).json(),p=r.product||{},n=String(p.product_name_it||p.product_name||'').trim();
   if(r.status!==1||!n)return say('Prodotto non trovato: scrivi il nome a mano');
   x=S.bc[c]={n:n.slice(0,60),g:String(p.generic_name_it||p.generic_name||'').slice(0,80)};save()}
  catch(e){return say('Nessuna connessione o prodotto non trovato: scrivi il nome a mano')}}
 const all=[...new Set(RC.flatMap(r=>r.i))],t=(x.n+' '+x.g).toLowerCase(),mt=all.filter(i=>t.includes(i)).sort((a,b)=>b.length-a.length)[0],pn=$('#pn');
 if(pn){pn.value=mt||x.n;pn.focus()}
 say('Prodotto: '+x.n+(mt?' → ingrediente suggerito: '+mt+' (modificabile)':' (nessun ingrediente delle ricette riconosciuto: modifica il nome)')+'. Poi premi Aggiungi.')}

/* ===== REGISTRO PASTI ===== */
function dayTot(dt){const t={k:0,p:0,h:0,f:0,n:0},m=S.mp&&S.mp.days.find(d=>d.d===dt);
 if(m&&!m.free)SL.forEach(s=>{if(m.out[s]){if(m.ko[s]){t.k+=m.ko[s];t.n++}}else if(m.done[s]){const r=rec(m.m[s]);t.k+=r.k;t.p+=r.p;t.h+=r.h;t.f+=r.f;t.n++}});
 (S.ml||[]).filter(x=>x.d===dt).forEach(x=>{t.k+=x.k;t.p+=x.p;t.h+=x.h;t.f+=x.f;t.n++});return t}
function eatPlan(){const i=S.mp?S.mp.days.findIndex(d=>d.d===day()):-1;if(i<0)return toast('Nessun piano per oggi');const d=S.mp.days[i];if(d.free)return toast('Oggi è giorno libero');SL.forEach(s=>{if(!d.done[s]&&!d.out[s])togDone(i,s)})}
function addLg(){const n=$('#ln').value.trim().slice(0,60);if(!n)return toast('Scrivi cosa hai mangiato');const v=id=>Math.min(5000,Math.max(0,Math.round(+$(id).value)||0));
 S.ml=S.ml||[];S.ml.push({id:Date.now(),d:day(),n,k:v('#lk'),p:v('#lp'),h:v('#lc'),f:v('#lg')});S.ml=S.ml.filter(x=>x.d>=day(-60));save();render()}
function delLg(id){S.ml=(S.ml||[]).filter(x=>x.id!==id);save();render()}
async function lgLook(c){c=String(c||'').replace(/\D/g,'');const m=$('#lm'),say=t=>{if(m)m.textContent=t};if(c.length<8||c.length>14)return say('Codice non valido');
 S.bn=S.bn||{};let x=S.bn[c];
 if(!x){say('Cerco '+c+'…');
  try{const r=await(await fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=product_name,product_name_it,nutriments')).json(),p=r.product||{},n=String(p.product_name_it||p.product_name||'').trim(),u=p.nutriments||{};
   if(r.status!==1||!n)return say('Prodotto non trovato: inserisci i valori a mano');
   x=S.bn[c]={n:n.slice(0,60),k:+u['energy-kcal_100g']||0,p:+u.proteins_100g||0,h:+u.carbohydrates_100g||0,f:+u.fat_100g||0};save()}
  catch(e){return say('Nessuna connessione o prodotto non trovato: inserisci i valori a mano')}}
 const q=Math.max(1,+$('#lq').value||100),f=v=>Math.round(v*q/100),set=(id,v)=>{const e=$(id);if(e)e.value=v};
 set('#lb',c);set('#ln',x.n);set('#lk',f(x.k));set('#lp',f(x.p));set('#lc',f(x.h));set('#lg',f(x.f));
 say(x.n+': valori per '+q+' g, indicativi (Open Food Facts).'+(x.k?'':' Calorie non disponibili: inseriscile a mano.')+' Cambia i grammi e premi Cerca per ricalcolare.')}
function lgv(){const t=dayTot(day()),T=tgt(),hide=N().hide,mm=mk(),gg=T?[T*mm[0]/400,T*mm[1]/400,T*mm[2]/900].map(Math.round):[0,0,0],ent=(S.ml||[]).filter(x=>x.d===day()),
 bar=(v,m)=>`<div class="bar" style="margin:4px 0"><i style="width:${m?Math.min(100,v/m*100):0}%;background:var(--cy)"></i></div>`,fi=(id,ph)=>`<input id="${id}" class="in" type="number" inputmode="numeric" placeholder="${ph}" style="margin:0;min-width:0">`;
 return`<button class="chip" onclick="go('cook')">← Cucina</button><h1 style="font-size:40px;margin-top:10px">Registro</h1>
 <div class="card">${hide?`<div class="mu">Calorie nascoste · ${t.n} pasti registrati oggi.</div>`:`<div class="row sp"><b>Oggi</b><span class="mu">${t.k}${T?' / circa '+T:''} kcal</span></div>${bar(t.k,T)}${['P','C','G'].map((l,i)=>`<div class="row sp mu"><span>${l}</span><span>${t[['p','h','f'][i]]}${T?' / '+gg[i]:''} g</span></div>`).join('')}<p class="mu" style="margin:6px 0 0">Stime indicative: nessun obiettivo da centrare al grammo.</p>`}</div>
 <button class="btn" onclick="eatPlan()">✓ Ho mangiato il piano di oggi</button>
 <h2>Ho mangiato altro</h2><div class="card"><div class="row"><input id="lb" class="in" inputmode="numeric" placeholder="Codice a barre" style="margin:0"><input id="lq" class="in" type="number" value="100" title="grammi" style="margin:0;width:80px"><button class="btn sm" onclick="lgLook($('#lb').value)">Cerca</button><button class="btn sm gh" onclick="scanStart(lgLook)">📷</button></div><div id="lm" class="mu" style="margin:6px 0 10px">Scansiona o scrivi un codice (grammi a destra), oppure compila a mano.</div>
 <input id="ln" class="in" placeholder="Cosa hai mangiato"><div class="row" style="margin-bottom:12px">${fi('lk','kcal')}${fi('lp','P g')}${fi('lc','C g')}${fi('lg','G g')}</div><button class="btn" onclick="addLg()">Aggiungi al registro</button></div>
 ${ent.length?'<h2>Aggiunti oggi</h2>'+ent.map(x=>`<div class="card ex"><div><b>${esc(x.n)}</b>${hide?'':`<div class="mu">${x.k} kcal · P ${x.p} · C ${x.h} · G ${x.f}</div>`}</div><button class="chip" onclick="delLg(${x.id})">✕</button></div>`).join(''):''}
 ${hide?'':'<h2>Ultimi 7 giorni</h2><div class="card">'+Array.from({length:7},(_,i)=>{const d=day(-i),x=dayTot(d);return`<div class="row sp mu"><span>${i?d.slice(8)+'/'+d.slice(5,7):'oggi'}</span><span>${x.n?x.k+' kcal · '+x.n+' pasti':'—'}</span></div>`}).join('')+'</div>'}`}

/* ===== IMPOSTAZIONI E PESO CORPOREO ===== */
const uk=()=>S.u==='lb'?2.20462:1,ul=()=>S.u==='lb'?'lb':'kg',cv=k=>Math.round(k*uk()*10)/10,tk=v=>Math.round(v/uk()*100)/100;
function wnext(id){S.wi=S.wi||{};S.wi[id]=(S.wi[id]||0)+1;delete S.wg[id];WF.delete(id);save();wfetch(id)}
function applyTheme(){const t=S.th||'scuro',lt=t==='chiaro'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches);document.documentElement.classList.toggle('lt',lt);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=lt?'#f4f4f8':'#0A0A0F'}
function setU(k,v){S[k]=v;save();applyTheme();render()}
function stgUI(){return`<h2>Impostazioni</h2><div class="mu">Unità dei pesi (esercizi e peso corporeo)</div><div class="chips" style="margin:6px 0 14px">${['kg','lb'].map(v=>cp((S.u||'kg')===v,`setU('u','${v}')`,v)).join('')}</div><div class="mu">Tema</div><div class="chips" style="margin:6px 0 14px">${[['scuro','Scuro'],['chiaro','Chiaro'],['auto','Automatico']].map(x=>cp((S.th||'scuro')===x[0],`setU('th','${x[0]}')`,x[1])).join('')}</div>`}
function bwCard(){if(N().hide)return'';const L=S.bw||[],l=L[L.length-1],w=L.filter(x=>x.d<=day(-6)).pop(),d=l&&w?Math.round((l.kg-w.kg)*uk()*10)/10:null;
 return`<div class="card"><b>Peso corporeo</b> <span class="mu">(facoltativo)</span>${l?`<div class="row sp" style="margin-top:6px"><span class="big" style="font-size:34px">${cv(l.kg)} ${ul()}</span>${spark(L.slice(-30).map(x=>cv(x.kg)))}</div><div class="mu">${d===null?'Registra ancora per vedere il trend settimanale':'Rispetto a una settimana fa: '+(d>0?'+':'')+d+' '+ul()}</div>`:''}<div class="row" style="margin-top:8px"><input id="bw" class="in" type="number" step="0.1" inputmode="decimal" placeholder="${ul()}" style="margin:0"><button class="btn sm" onclick="addBw()">Registra</button></div><div class="mu" style="margin-top:6px">Resta sul tuo dispositivo. Si nasconde con “Nascondi calorie” in Dieta e attrezzi.</div></div>`}
function addBw(){const v=tk(parseFloat($('#bw').value));if(!(v>20&&v<400))return toast('Valore non valido');S.bw=(S.bw||[]).filter(x=>x.d!==day());S.bw.push({d:day(),kg:v});S.bw=S.bw.slice(-120);S.pf.kg=String(Math.round(v*10)/10);save();render()}

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();ntfNow();render();
</script></body></html>
